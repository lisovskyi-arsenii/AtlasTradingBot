[package]
name = "RustBot"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5+spec-1.1.0"
ta = "0.5.0"
clap = "4.6.1"
dotenvy = "0.15"
chrono = "0.4.45"
csv = "1.4.0"
csv-async = { version = "1.3.1", features = ["tokio"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
rand = "0.10.2"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tungstenite = "0.30.0"
async-trait = "0.1.92"
futures-util = "0.3.34"
prometheus = "0.14"
prometheus_exporter = "0.8.5"
hyper = { version = "1.11.1", features = ["full"] }
thiserror = "2"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }

# Execution broker — HMAC signing for Binance REST API
hmac = "0.13"
sha2 = "0.11.0"
hex = "0.4.3"
axum = { version = "0.8.9", features = ["ws"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
url = "2.5.8"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "strategy_bench"
harness = false
