[package]
name = "RustBot"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.8"
ta = "0.5.0"
clap = "4.6.1"
dotenvy = "0.15"
chrono = "0.4.45"
csv = "1.4.0"
csv-async = { version = "1.3.1", features = ["tokio"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
rand = "0.8.6"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tungstenite = "0.29.0"
async-trait = "0.1.89"
futures-util = "0.3"
prometheus = "0.13"
prometheus_exporter = "0.8"
hyper = { version = "0.14", features = ["full"] }

# Execution broker — HMAC signing for Binance REST API
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.8.9", features = ["ws"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
url = "2.5.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "strategy_bench"
harness = false
