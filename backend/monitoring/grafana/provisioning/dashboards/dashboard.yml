# Grafana dashboard provisioning — auto-loads dashboard JSON files.
apiVersion: 1

providers:
  - name: 'AtlasTradingBot'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
