[package]
name = "RustBot"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ta = "0.5"
clap = "4"
chrono = "0.4"
csv = "1"
csv-async = { version = "1.3", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
rand = "0.8"
