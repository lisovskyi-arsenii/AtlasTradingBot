[bot]
mode = "spot"
exchange = "binance"
symbol = "BTCUSDT"
leverage = 10.0
margin = 1000.0

[strategy]
# Indicator periods
slow_period = 30
fast_period = 10
trend_period = 50
rsi_period = 14
atr_period = 14
macro_period = 200
vol_sma_period = 20
z_score_period = 14
ema_period = 200

# Entry / exit thresholds
z_entry = -2.0
short_z_entry = 0.25
atr_multiplier = 3.0
short_stop_atr_mult = 2.0
short_tp_atr_mult = 4.0
take_profit_r_multiplier = 4.5
min_profit_for_rsi_exit_pct = 0.004

# Risk and cooldowns
short_cooldown_bars = 4
cooldown_bars = 2
loss_cooldown_bars = 8
take_profit_cooldown_bars = 3
min_bars_in_position = 5
default_risk_per_trade_pct = 0.005
max_strategy_drawdown_pct = 12.0

# Long/short and hard risk controls
# Mean-reversion both ways: long oversold dips, short overbought rips.
enable_long = true
# NOTE: real Binance Spot cannot short. Set true only for backtests / margin/futures.
enable_short = true
# Hard stop on unrealised loss (fraction): 0.05 = -5%. Bypasses min_bars_in_position. 0 disables.
panic_stop_loss_pct = 0.05
# Mean-reversion take-profit band: exit long when z >= z_exit, short when z <= -z_exit.
z_exit = 3.0
# When true, only fade dips in an uptrend / rips in a downtrend (price vs EMA). false = pure MR.
use_trend_filter = true

# --- Order-book imbalance (OBI) filter — LIVE ONLY ---
# Requires a live depth stream, so it has NO effect on backtests (OHLC data has
# no order book). When on, a long needs obi >= +obi_threshold and a short needs
# obi <= -obi_threshold before entry. obi is (bid_qty - ask_qty)/(bid_qty + ask_qty)
# over the top `obi_depth_levels` of the book, range -1..1.
use_order_book_filter = false
obi_threshold = 0.15
obi_depth_levels = 5

[runtime]
backtest_csv_path = "BTCUSDT-1h-2026-05.csv"
# Symbols traded in batch backtest / live candidates. Edit to focus capital on
# the symbols you want; all of these are net-profitable on the 1y/1h dataset.
backtest_symbols = [
    "BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "XRPUSDT",
    "TRXUSDT", "PEPEUSDT", "SUIUSDT", "BABYUSDT", "XLMUSDT",
]
live_log_path = "trading_bot.csv"
candle_timeframe_seconds = 900
poll_interval_seconds = 3

# Relative capital weights per symbol. Total capital is unchanged; weights only
# redistribute it. A symbol not listed defaults to weight 1.0. Empty/omitted =
# equal split (unchanged). WARNING: weighting toward past backtest winners is
# overfitting — symbol ranks are unstable across periods. Tune deliberately.
# NOTE: this is a sub-table, so it MUST stay at the very end of [runtime]
# (any plain keys after it would be parsed as weights and break the config).
# [runtime.symbol_weights]
# ETHUSDT = 2.0
# XRPUSDT = 1.5
# BTCUSDT = 0.5
# XLMUSDT = 0.5

