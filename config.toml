[bot]
mode = "spot"
exchange = "binance"
symbol = "BTCUSDT"
leverage = 10.0
margin = 1000.0
# Use testnet for testing with fake money (set to false for real trading)
use_testnet = true

[strategy]
# Indicator periods
slow_period = 30
fast_period = 10
trend_period = 50
rsi_period = 14
atr_period = 14
macro_period = 200
vol_sma_period = 20
z_score_period = 14
ema_period = 200

# Entry / exit thresholds
z_entry = -2.0
short_z_entry = 0.3
atr_multiplier = 3.0
short_stop_atr_mult = 2.0
short_tp_atr_mult = 4.0
take_profit_r_multiplier = 4.5
min_profit_for_rsi_exit_pct = 0.004

# Risk and cooldowns
short_cooldown_bars = 4
cooldown_bars = 2
loss_cooldown_bars = 8
take_profit_cooldown_bars = 3
min_bars_in_position = 5
# Risk per trade. Tuned so the worst single-symbol drawdown stays < 10% on the
# 1y/1h dataset (pruned symbol set below). 0.006 -> ~+13.8% / worst DD ~-9.5%.
# Drop to 0.005 for more buffer (~+11.5% / -8.2%); 0.007 reaches ~+16% but
# breaches 10% DD. Profit and drawdown scale together — this is the main lever.
default_risk_per_trade_pct = 0.010
max_strategy_drawdown_pct = 12.0

# Long/short and hard risk controls
# Mean-reversion both ways: long oversold dips, short overbought rips.
enable_long = true
# NOTE: real Binance Spot cannot short. Set true only for backtests / margin/futures.
enable_short = true
# Hard stop on unrealised loss (fraction): 0.05 = -5%. Bypasses min_bars_in_position. 0 disables.
panic_stop_loss_pct = 0.05
# Mean-reversion take-profit band: exit long when z >= z_exit, short when z <= -z_exit.
z_exit = 3.0
# When true, only fade dips in an uptrend / rips in a downtrend (price vs EMA). false = pure MR.
use_trend_filter = true

# --- Order-book imbalance (OBI) filter — LIVE ONLY ---
# Requires a live depth stream, so it has NO effect on backtests (OHLC data has
# no order book). When on, a long needs obi >= +obi_threshold and a short needs
# obi <= -obi_threshold before entry. obi is (bid_qty - ask_qty)/(bid_qty + ask_qty)
# over the top `obi_depth_levels` of the book, range -1..1.
use_order_book_filter = false
obi_threshold = 0.15
obi_depth_levels = 5

# --- Multi-timeframe (MTF) macro trend filter ---
# Aggregates the base 1h candles into a higher-timeframe (HTF) candle and only
# allows longs when the HTF trend is up (HTF close > HTF EMA) and shorts when it
# is down. Fully backtestable (built from the same OHLC data).
# Off by default: this is a MEAN-REVERSION (counter-trend) strategy, so gating on
# the macro trend trims edge. Backtest (1y/1h, pruned 8 symbols, risk 0.006):
#   off            -> +13.84% / DD -9.51%  (best return)
#   bars=12 ema=50 -> +13.11% / DD -8.98%  (near-same return, smoother / lower DD)
#   bars=4  ema=200-> +12.75% / DD -9.37%
# Turn on only if you prefer the lower-drawdown profile. mtf_bars is in base
# candles (12 = 12h on 1h data); mtf_ema_period is in HTF candles.
use_mtf_filter = false
mtf_bars = 12
mtf_ema_period = 50

# --- BTC circuit-breaker filter ---
# Blocks new entries when BTC is crashing (price drops below threshold over lookback period).
# Designed to reduce drawdown during market-wide sell-offs. Fully backtestable.
# Default: off (set to true to enable). Threshold: -0.03 = -3% drop over lookback period.
use_btc_circuit_breaker = false
btc_crash_threshold_pct = -0.03
btc_crash_lookback_bars = 24

[runtime]
backtest_csv_path = "BTCUSDT-1h-2026-01-01-2026-05-31.csv"
# Symbols traded in batch backtest / live candidates. Using larger 5-month datasets
# for more statistically significant backtest results (3600 candles vs 1000).
backtest_symbols = [
    "ETHUSDT", "XRPUSDT", "TRXUSDT", "PEPEUSDT", "DOGEUSDT", "SOLUSDT", "SUIUSDT",
]
live_log_path = "trading_bot.csv"
candle_timeframe_seconds = 900
poll_interval_seconds = 3
# Port for Prometheus metrics endpoint (0 disables). Default: 9100
metrics_port = 9100

# Relative capital weights per symbol. Total capital is unchanged; weights only
# redistribute it. A symbol not listed defaults to weight 1.0. Empty/omitted =
# equal split (unchanged). WARNING: weighting toward past backtest winners is
# overfitting — symbol ranks are unstable across periods. Tune deliberately.
# NOTE: this is a sub-table, so it MUST stay at the very end of [runtime]
# (any plain keys after it would be parsed as weights and break the config).
[runtime.symbol_weights]
ETHUSDT = 2.0
XRPUSDT = 2.0
TRXUSDT = 2.0
PEPEUSDT = 1.5
DOGEUSDT = 1.5
SOLUSDT = 0.8
SUIUSDT = 0.8
BTCUSDT = 0.3
XLMUSDT = 0.2
BABYUSDT = 0.2
