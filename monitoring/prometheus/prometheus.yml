# Prometheus scrape configuration for AtlasTradingBot
# Scrape the bot's /metrics endpoint every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'atlas-trading-bot'
    scrape_interval: 15s
    static_configs:
      # host.docker.internal resolves to the host machine from inside Docker.
      # On Linux you may need to add --add-host=host.docker.internal:host-gateway
      # to docker run, or replace this with your LAN IP (e.g. 192.168.x.x:9100).
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'atlas-bot-live'
